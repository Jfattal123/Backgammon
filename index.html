<style>
/* Layout: one full-height screen; a slim top bar and the board filling every remaining pixel.

:root {

  --chk-light: #f2efe9;

  --chk-dark: #1a1d21;
  --chk-dark-rim: #4a5058;
  --board-text: #8fa6a4;

  --font-ui: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;

/* ---------- top bar ---------- */

.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.chip.best { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }

.review { position: fixed; inset: 0; z-index: 15; background: var(--bg); display: flex; flex-direction: column; animation: fade .15s ease-out; overflow: hidden; }
.review .muted { color: var(--muted); }
.review .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
/* header: back · games · whose · which · stats */
.rvh { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); }

.bands button { flex: 1 1 0; min-width: 0; border: 0; background: transparent; border-radius: 8px; padding: 3px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 40px; cursor: pointer; color: var(--muted); line-height: 1.15; }
.bands .n { font-family: var(--font-num); font-weight: 600; font-size: 15px; color: var(--fg); }

.bands .b-good .n { color: var(--good); } .bands .b-doubtful .n { color: var(--doubtful); } .bands .b-error .n { color: var(--error); } .bands .b-blunder .n { color: var(--blunder); }
.bands button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.16); }
@media (max-width: 899px) { .rvh .bands { flex: 1 1 100%; order: 9; } }
@media (max-width: 480px) { .rvh h1, .rvh .lt { display: none; } .rvh .iconbtn.labelled { width: 38px; padding: 0; justify-content: center; } .seg.sm button { padding: 6px 9px; max-width: 76px; } }

/* main area. Phones held upright: board, decision card, then the other moves scrolling underneath */
.rv-main { flex: 1 1 auto; min-height: 0; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); grid-template-areas: "board" "card" "more";
  padding: 8px max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); }
.rvboard { grid-area: board; min-height: 0; min-width: 0; touch-action: pan-y; }

<script>
/* ===================== RULES ===================== */
// Each side's board: array(25) from its own perspective: 0 = ace point .. 23 = 24-point, 24 = bar.
const R = (() => {
  const startSide = () => { const a = Array(25).fill(0); a[5] = 5; a[7] = 3; a[12] = 5; a[23] = 2; return a; };
  const sum = (a) => a.reduce((s, x) => s + x, 0);
  const off = (a) => 15 - sum(a);
  const pips = (a) => a.reduce((s, x, i) => s + x * (i + 1), 0);
  const key = (me, opp) => me.join(',') + '|' + opp.join(',');
  const canBearOff = (me) => { if (me[24]) return false; for (let i = 6; i < 24; i++) if (me[i]) return false; return true; };

  // Returns destination index (-1 = off) or null if illegal.
  function subDest(me, opp, from, d) {
    if (!me[from]) return null;
    if (me[24] && from !== 24) return null;
    const to = from - d;
    if (to >= 0) return opp[23 - to] >= 2 ? null : to;
    if (!canBearOff(me)) return null;
    if (to === -1) return -1;
    for (let i = from + 1; i < 6; i++) if (me[i]) return null;
    return -1;
  }
  // Applies in place; returns {to, hit}
  function applySub(me, opp, from, d) {
    const to = subDest(me, opp, from, d);
    me[from]--;
    let hit = false;
    if (to >= 0) {
      me[to]++;
      if (opp[23 - to] === 1) { opp[23 - to] = 0; opp[24]++; hit = true; }
    }
    return { from, to, die: d, hit };
  }
  const diceList = (d0, d1) => d0 === d1 ? [d0, d0, d0, d0] : [d0, d1];
  const removeOne = (arr, v) => { const i = arr.indexOf(v); const c = arr.slice(); c.splice(i, 1); return c; };
  const distinct = (arr) => [...new Set(arr)];

  // Max number of dice playable from this state with the remaining dice.
  function maxUsable(me, opp, rem, memo) {
    if (!rem.length) return 0;
    const k = key(me, opp) + '#' + rem.slice().sort().join('');
    if (memo.has(k)) return memo.get(k);
    let best = 0;
    outer: for (const d of distinct(rem)) {
      for (let f = 24; f >= 0; f--) {
        if (subDest(me, opp, f, d) === null) continue;
        const m2 = me.slice(), o2 = opp.slice();
        applySub(m2, o2, f, d);
        const v = 1 + maxUsable(m2, o2, removeOne(rem, d), memo);
        if (v > best) best = v;
        if (best === rem.length) break outer;
      }
    }
    memo.set(k, best);
    return best;
  }

  // Turn analysis for a roll: computes the number of dice that must be played,
  // the larger-die rule, and all distinct final positions.
  function turnInfo(me, opp, d0, d1) {
    const dice = diceList(d0, d1);
    const memo = new Map();
    const maxTotal = maxUsable(me, opp, dice, memo);
    let forceDie = null;
    if (maxTotal === 1 && d0 !== d1) {
      const hi = Math.max(d0, d1);
      for (let f = 24; f >= 0; f--) if (subDest(me, opp, f, hi) !== null) { forceDie = hi; break; }
    }
    // collect distinct finals
    const finals = new Map(); // key -> sequence
    const seen = new Set();
    (function dfs(m, o, rem, seq) {
      if (seq.length === maxTotal) { const k = key(m, o); if (!finals.has(k)) finals.set(k, seq.slice()); return; }
      const sk = key(m, o) + '#' + rem.slice().sort().join('') + '#' + seq.length;
      if (seen.has(sk)) return; seen.add(sk);
      for (const d of distinct(rem)) {
        if (seq.length === 0 && forceDie && d !== forceDie) continue;
        for (let f = 24; f >= 0; f--) {
          if (subDest(m, o, f, d) === null) continue;
          const m2 = m.slice(), o2 = o.slice();
          const s = applySub(m2, o2, f, d);
          if (seq.length + 1 + maxUsable(m2, o2, removeOne(rem, d), memo) !== maxTotal) continue;
          seq.push(s); dfs(m2, o2, removeOne(rem, d), seq); seq.pop();
        }
      }
    })(me.slice(), opp.slice(), dice, []);
    return { dice, maxTotal, forceDie, finals, memo };
  }

  // Given the state after a partial move, is submove (from, d) legal as the next step?
  function stepLegal(ti, me, opp, rem, done, from, d) {
    if (!rem.includes(d)) return false;
    if (done === 0 && ti.forceDie && d !== ti.forceDie) return false;
    if (subDest(me, opp, from, d) === null) return false;
    const m2 = me.slice(), o2 = opp.slice();
    applySub(m2, o2, from, d);
    return done + 1 + maxUsable(m2, o2, removeOne(rem, d), ti.memo) === ti.maxTotal;
  }

  // All destinations for the checker at `from`, including multi-step moves of the same checker.
  // order: preferred die order (array of die values, first = preferred).
  function destinations(ti, me, opp, rem, done, from, order) {
    const res = new Map(); // dest -> path [{from,d}]
    const pref = distinct(order.filter(d => rem.includes(d)).concat(rem));
    (function walk(m, o, r, dn, f, path) {
      for (const d of pref) {
        if (!r.includes(d)) continue;
        if (!stepLegal(ti, m, o, r, dn, f, d)) continue;
        const m2 = m.slice(), o2 = o.slice();
        const s = applySub(m2, o2, f, d);
        const p2 = path.concat([{ from: f, d }]);
        const prev = res.get(s.to);
        if (!prev || prev.length > p2.length) res.set(s.to, p2);
        // bearing off: when several dice work, use the smallest so the larger stays free
        else if (s.to < 0 && prev.length === p2.length && p2.length === 1 && d < prev[0].d) res.set(s.to, p2);
        if (s.to >= 0 && !s.hit) walk(m2, o2, removeOne(r, d), dn + 1, s.to, p2);
        else if (s.to >= 0 && s.hit && p2.length < 4) walk(m2, o2, removeOne(r, d), dn + 1, s.to, p2);
      }
    })(me, opp, rem, done, from, []);
    return res;
  }

  // Convert a sequence of submoves to gnubg anMove (8 ints, -1 padded)
  function toGnubg(seq) {
    const a = [];
    for (const s of seq) a.push(s.from, s.to < 0 ? -1 : s.to);
    while (a.length < 8) a.push(-1);
    return a.slice(0, 8);
  }

  // Simulate gnubg move pairs on boards (copy), returning submoves with hit info
  function simulatePairs(me, opp, pairs) {
    const m = me.slice(), o = opp.slice(), subs = [];
    for (let i = 0; i < pairs.length; i += 2) {
      const from = pairs[i], to = pairs[i + 1];
      m[from]--;
      let hit = false;
      if (to >= 0) { m[to]++; if (o[23 - to] === 1) { o[23 - to] = 0; o[24]++; hit = true; } }
      subs.push({ from, to, hit, die: to < 0 ? null : from - to });
    }
    return { subs, me: m, opp: o };
  }

  // Standard notation, e.g. "13/9 24/21", "bar/22*", "6/off(2)", "13/7*/2"
  function notation(me, opp, pairs) {
    if (!pairs || !pairs.length) return 'No move';
    const { subs } = simulatePairs(me, opp, pairs);
    const name = (i) => i === 24 ? 'bar' : i < 0 ? 'off' : String(i + 1);
    // chain moves of the same checker
    let segs = subs.map(s => ({ pts: [s.from, s.to], hits: [false, s.hit] }));
    let merged = true;
    while (merged) {
      merged = false;
      for (let i = 0; i < segs.length && !merged; i++) {
        for (let j = 0; j < segs.length && !merged; j++) {
          if (i === j) continue;
          const a = segs[i], b = segs[j];
          const aEnd = a.pts[a.pts.length - 1];
          if (aEnd >= 0 && aEnd === b.pts[0]) {
            // only merge if no other segment ends at the same point (keeps it unambiguous)
            const others = segs.filter((s, k) => k !== i && s.pts[s.pts.length - 1] === aEnd).length;
            const starters = segs.filter((s, k) => k !== j && s.pts[0] === aEnd).length;
            if (others || starters) continue;
            segs[i] = { pts: a.pts.concat(b.pts.slice(1)), hits: a.hits.concat(b.hits.slice(1)) };
            segs.splice(j, 1);
            merged = true;
          }
        }
      }
    }
    const strs = segs.map(sg => {
      let out = name(sg.pts[0]);
      for (let k = 1; k < sg.pts.length; k++) {
        const isLast = k === sg.pts.length - 1;
        if (!isLast && !sg.hits[k]) continue; // skip silent intermediate points
        out += '/' + name(sg.pts[k]) + (sg.hits[k] ? '*' : '');
      }
      return { s: out, from: sg.pts[0] };
    });
    strs.sort((a, b) => b.from - a.from);
    const counts = new Map();
    for (const x of strs) counts.set(x.s, (counts.get(x.s) || 0) + 1);
    return [...counts.entries()].map(([s, c]) => c > 1 ? `${s}(${c})` : s).join(' ');
  }

  // Result of a finished game for the winner given loser's board
  function gameValue(loser) {
    if (off(loser) > 0) return 1;
    let bg = loser[24] > 0;
    for (let i = 18; i < 24; i++) if (loser[i]) bg = true;
    return bg ? 3 : 2;
  }

  return { startSide, sum, off, pips, key, canBearOff, subDest, applySub, diceList, removeOne, turnInfo, stepLegal, destinations, toGnubg, simulatePairs, notation, gameValue };
})();

    }
    cg.innerHTML = s;
    if (showPips && cb.pips) {
      const pp = cb.pips();
      const rx = g.mx(G.RAILX);
      const pipTxt = (y, v, lblDy) => ROT
        ? `<text x="${rx}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="var(--board-text)" style="font-family:var(--font-num)"${trT(rx, y)}>${v} <tspan font-size="9" opacity=".7" letter-spacing="1">PIPS</tspan></text>`
        : `<text x="${rx}" y="${y}" text-anchor="middle" font-size="13" font-weight="600" fill="var(--board-text)" style="font-family:var(--font-num)">${v}</text><text x="${rx}" y="${y + lblDy}" text-anchor="middle" font-size="9" letter-spacing="1" fill="var(--board-text)" opacity=".7">PIPS</text>`;
      layers.pips.innerHTML = pp ? pipTxt(G.H - G.FV - 70, pp[0], -16) + pipTxt(G.FV + 78, pp[1], 16) : '';
    } else layers.pips.innerHTML = '';
  }

  const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  function setXY(id, x, y, scale) {
    const el = els.get(id);
    el.setAttribute('transform', `translate(${x},${y})${scale && scale !== 1 ? ` scale(${scale})` : ''}`);
    posOf.set(id, { x, y });
  }
  function animateTo(id, pt, dur, lift, endScale) {
    const el = els.get(id);
    const from = posOf.get(id) || pt;
    dur = reduceMotion ? 0 : dur * speed;
    if (dur <= 0) { setXY(id, pt.x, pt.y); return Promise.resolve(); }
    if (lift) layers.drag.appendChild(el);
    const disc = el.querySelector('.disc');
    if (lift && disc) disc.setAttribute('filter', 'url(#fLift)');
    return new Promise(res => {
      const t0 = performance.now();
      function step(now) {
        const t = Math.min(1, (now - t0) / dur), e = ease(t);
        const x = from.x + (pt.x - from.x) * e, y = from.y + (pt.y - from.y) * e;
        let sc = lift ? 1 + 0.09 * Math.sin(Math.PI * t) : 1;
        if (endScale) sc *= 1 + (endScale - 1) * e;
        setXY(id, x, y, sc);
        if (t < 1) requestAnimationFrame(step);
        else {
          if (lift && disc) disc.setAttribute('filter', 'url(#fShadow)');
          res();
        }
      }
      requestAnimationFrame(step);
    });
  }

  function setTrayLook(id, inTray) {
    const el = els.get(id);
    if (inTray) { const r = el.querySelector('.mk'); if (r) r.remove(); }
    el.classList.toggle('tray', inTray);
    el.querySelector('.disc').style.display = inTray ? 'none' : '';
    el.querySelector('.slab').style.display = inTray ? '' : 'none';
  }

  // Move top checker of player p from index `from` to `to` (-1 off). hit handled if flagged.
  async function moveChecker(p, from, to, hit, opts = {}) {
    const fl = locOf(p, from), tl = locOf(p, to);
    const fk = locKey(fl), tk = locKey(tl);
    const fst = stacks.get(fk) || [];
    const id = fst.pop();
    if (id == null) return;
    const proms = [];
    let hitId = null;
    if (hit) {
      const tst = stacks.get(tk) || [];
      hitId = tst.pop();
      const bl = { t: 'bar', p: 1 - p };
      push(locKey(bl), hitId); where.set(hitId, bl);
    }
    push(tk, id); where.set(id, tl);
    const tst = stacks.get(tk);
    const target = g.stackPos(tl, tst.length - 1, tst.length);
    const dur = opts.dur != null ? opts.dur : 270;
    if (tl.t !== 'off') setTrayLook(id, false);
    cb.sound && cb.sound('move');
    // borne-off checkers shrink as they slide into the tray, then settle as a slab
    const main = animateTo(id, target, dur, true, tl.t === 'off' ? 0.55 : null).then(() => {
      if (tl.t === 'off') { setTrayLook(id, true); setXY(id, target.x, target.y); }
      cb.sound && cb.sound(tl.t === 'off' ? 'off' : 'place');
    });
    proms.push(main);
    if (hitId != null) {
      const bl = { t: 'bar', p: 1 - p };
      proms.push(new Promise(r => setTimeout(r, dur * speed * 0.55)).then(() => { cb.sound && cb.sound('hit'); return animateTo(hitId, g.stackPos(bl, stacks.get(locKey(bl)).length - 1, stacks.get(locKey(bl)).length), 300, true); }));
    }
    await Promise.all(proms);
    // relayout affected stacks (compression)
    await Promise.all([layoutStack(fk, fl, true), layoutStack(tk, tl, true), hitId != null ? layoutStack(locKey({ t: 'bar', p: 1 - p }), { t: 'bar', p: 1 - p }, true) : null]);
    orderZ();
    updateCounts();
    return id;
  }

  // Reverse of moveChecker (for undo)
  async function unmoveChecker(p, from, to, hit) {
    const fl = locOf(p, from), tl = locOf(p, to);
    const fk = locKey(fl), tk = locKey(tl);
    const id = (stacks.get(tk) || []).pop();
    if (id == null) return;
    push(fk, id); where.set(id, fl);
    setTrayLook(id, false);
    const fst = stacks.get(fk);
    const proms = [animateTo(id, g.stackPos(fl, fst.length - 1, fst.length), 200, true)];
    if (hit) {
      const bl = { t: 'bar', p: 1 - p }, bk = locKey(bl);
      const hid = stacks.get(bk).pop();
      push(tk, hid); where.set(hid, tl);
      const tst = stacks.get(tk);
      proms.push(animateTo(hid, g.stackPos(tl, tst.length - 1, tst.length), 220, true));
      proms.push(layoutStack(bk, bl, true));
    }
    cb.sound && cb.sound('place');
    await Promise.all(proms);
    await Promise.all([layoutStack(fk, fl, true), layoutStack(tk, tl, true)]);
    orderZ();
    updateCounts();
  }

  /* ---- dice ---- */
  let diceState = null; // {p, vals, used:[bool], order:[i,j]}
  function drawDice(st, dieRot) {
    diceState = st;
    if (cb.barDice && !dieRot) cb.barDice(st);
    if (!st) { layers.dice.innerHTML = ''; return; }
    const c = g.diceCenter(st.p), col = diceColors(st.p, humanLight);
    let s = '';
    const vals = st.vals;
    if (st.single) {
      // opening roll: one die each side
      for (const [pp, v] of st.single) {
        const cc = g.diceCenter(pp);
        s += dieSVG(cc.x, cc.y, v, diceColors(pp, humanLight), { rot: dieRot ? dieRot[pp] : 0 });
      }
      layers.dice.innerHTML = s; return;
    }
    if (vals.length === 4) {
      // doubles: show two dice, with small used markers
      const usedN = st.used.filter(Boolean).length;
      s += `<g class="btn" data-btn="dice" role="button" aria-label="Dice">`;
      const a = offs(c, -33), b2 = offs(c, 33);
      s += dieSVG(a.x, a.y, vals[0], col, { used: usedN >= 4, rot: dieRot ? dieRot[0] : 0 });
      s += dieSVG(b2.x, b2.y, vals[0], col, { rot: dieRot ? dieRot[1] : 0 });
      // markers under the dice showing how many moves are left
      for (let k = 0; k < 4; k++) { const q = offs(c, -27 + k * 18, 44); s += `<circle cx="${q.x}" cy="${q.y}" r="4.5" fill="${k < 4 - usedN ? '#f2b84b' : 'rgba(255,255,255,.18)'}"/>`; }
      s += `</g>`;
    } else {
      const ord = st.order || [0, 1];
      s += `<g class="btn" data-btn="dice" role="button" aria-label="Dice, tap to swap order">`;
      ord.forEach((vi, pos) => { const q = offs(c, pos === 0 ? -33 : 33); s += dieSVG(q.x, q.y, vals[vi], col, { used: st.used[vi], rot: dieRot ? dieRot[pos] : 0 }); });
      s += `</g>`;
    }
    layers.dice.innerHTML = s;
  }
  async function rollDice(st, dur) {
    dur = reduceMotion ? 0 : dur;
    cb.sound && cb.sound('dice');
    if (dur > 0) {
      const t0 = performance.now();
      await new Promise(res => {
        let last = 0;
        function step(now) {
          const t = (now - t0) / dur;
          if (t >= 1) return res();
          if (now - last > 55) {
            last = now;
            const fake = st.single
              ? { single: st.single.map(([pp]) => [pp, 1 + Math.floor(Math.random() * 6)]) }
              : { ...st, vals: st.vals.map(() => 1 + Math.floor(Math.random() * 6)) };
            const rr = (1 - t) * 40;
            const dr = st.single ? { 0: (Math.random() - .5) * rr, 1: (Math.random() - .5) * rr } : [(Math.random() - .5) * rr, (Math.random() - .5) * rr];
            if (fake.vals && fake.vals.length === 4) fake.vals = [fake.vals[0], fake.vals[0], fake.vals[0], fake.vals[0]];
            drawDice(fake, dr);
          }
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      });
    }
    drawDice(st);
  }

  /* ---- cube ---- */
  let cubeState = null;
  function drawCube(st, animate) {
    const prevPos = cubeState && cubeState.pos;
    cubeState = st;
    if (!st || !st.on) { layers.cube.innerHTML = ''; return; }
    const pos = g.cubePos(st.owner, st.offeredTo);
    const val = st.offeredTo != null ? st.value * 2 : (st.owner === -1 ? (st.value > 1 ? st.value : 64) : st.value);
    const size = st.offeredTo != null ? 64 : 46;
    let html = cubeSVG(0, 0, val, size);
    let extra = '';
    if (st.canDouble) {
      // the cube itself is the Double button, with a small label beside it on the rail
      html = `<rect x="${-size / 2 - 5}" y="${-size / 2 - 5}" width="${size + 10}" height="${size + 10}" rx="12" fill="none" stroke="#f2b84b" stroke-width="2.5"><animate attributeName="opacity" values="1;.45;1" dur="1.6s" repeatCount="indefinite"/></rect>` + html;
      const q = ROT ? offs(pos, 64, 0) : offs(pos, 0, st.owner === 0 ? -48 : 48);
      extra = `<g class="btn" data-btn="double" role="button" tabindex="0" aria-label="Offer a double" transform="translate(${q.x},${q.y})${trG()}">
        <rect x="-26" y="-13" width="52" height="26" rx="13" fill="#f2b84b"/>
        <text y="4" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing=".3" fill="#16201d">DOUBLE</text></g>`;
    }
    layers.cube.innerHTML = `<g class="cubewrap${st.canDouble ? ' btn' : ''}" ${st.canDouble ? 'data-btn="double" role="button" aria-label="Offer a double"' : ''} transform="translate(${pos.x},${pos.y})${trG()}">${html}</g>${extra}`;
    if (animate && prevPos && !reduceMotion && (prevPos.x !== pos.x || prevPos.y !== pos.y)) {
      const w = layers.cube.querySelector('.cubewrap');
      const from = prevPos;
      const t0 = performance.now(), dur = 300 * speed;
      w.setAttribute('transform', `translate(${from.x},${from.y})${trG()}`);
      (function step(now) { const t = Math.min(1, (now - t0) / dur), e = ease(t); w.setAttribute('transform', `translate(${from.x + (pos.x - from.x) * e},${from.y + (pos.y - from.y) * e})${trG()}`); if (t < 1) requestAnimationFrame(step); })(t0);
    }
    cubeState.pos = pos;
  }

  /* ---- buttons ---- */
  // btns: [{id, label, kind:'primary'|'accent'|'ghost', side:0|1, slot:'left'|'right'|'center'|'l2'|'r2', w}]
  function drawButtons(btns) {
    let s = '';
    // portrait: large HTML buttons below the board instead of tiny in-board ones
    if (cb.htmlButtons) {
      cb.htmlButtons(btns || []);
      if (cb.isPortrait && cb.isPortrait()) { layers.btn.innerHTML = ''; return; }
    }
    // scale buttons up when the board is drawn small (phones in landscape)
    const bw = svg.getBoundingClientRect().width || G.W;
    const k = Math.min(1.45, Math.max(1, 0.62 / (bw / G.W)));
    for (const b of btns || []) {
      if (b.htmlOnly) continue;
      const c = g.halfCenter(b.side || 0);
      const w = (b.w || 112) * Math.min(k, 1.15), h = 46 * k;
      let dx = 0;
      if (b.slot === 'left') dx = -64; else if (b.slot === 'right') dx = 64;
      else if (b.slot === 'farleft') dx = -128; else if (b.slot === 'farright') dx = 128;
      const q = offs(c, dx, b.dy || 0), x = q.x, y = q.y;
      const fill = b.kind === 'accent' ? '#f2b84b' : b.kind === 'primary' ? '#f2efe9' : 'rgba(255,255,255,.10)';
      const tc = b.kind === 'ghost' ? '#e6ece9' : '#16201d';
      const stroke = b.kind === 'ghost' ? 'rgba(255,255,255,.22)' : 'none';
      s += `<g class="btn" data-btn="${b.id}" role="button" tabindex="0" aria-label="${esc(b.aria || b.label)}" transform="translate(${x},${y})${trG()}">
        <rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${fill}" stroke="${stroke}" stroke-width="1.5" ${b.kind !== 'ghost' ? 'filter="url(#fShadow)"' : ''}/>
        ${b.icon ? `<g transform="translate(${-w / 2 + 22},0)" stroke="${tc}" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${b.icon}</g>` : ''}
        <text x="${b.icon ? 10 : 0}" y="${6 * k}" text-anchor="middle" font-size="${16 * k}" font-weight="700" fill="${tc}">${esc(b.label)}</text>
      </g>`;
    }
    layers.btn.innerHTML = s;
  }

  // status text in a half (e.g., thinking)
  function drawStatus(side, text) {
    let el = svg.querySelector('#lyStatus');
    if (!el) { el = document.createElementNS(SVGNS, 'g'); el.id = 'lyStatus'; layers.btn.before(el); }
    if (!text) { el.innerHTML = ''; return; }
    const c = g.halfCenter(side);
    el.innerHTML = `<g transform="translate(${c.x},${c.y})${trG()}"><rect x="-80" y="-18" width="160" height="36" rx="18" fill="rgba(0,0,0,.28)"/>
      <circle cx="-52" cy="0" r="4" fill="#f2b84b"><animate attributeName="opacity" values="1;.25;1" dur="1s" repeatCount="indefinite"/></circle>
      <text x="8" y="5" text-anchor="middle" font-size="14" font-weight="600" fill="#e6ece9">${esc(text)}</text></g>`;
  }

  /* ---- highlights ---- */
  function showDests(fromIdx, map) {
    dests = map;
    let s = '';
    if (map) for (const [d] of map) {
      const loc = locOf(0, d);
      if (loc.t === 'off') {
        const x = g.mx(G.TRAYX), y = G.MIDY + 8 + (G.FH / 2 - 8) / 2;
        s += `<rect x="${x - (G.TRAY - 14) / 2}" y="${G.MIDY + 8}" width="${G.TRAY - 14}" height="${G.FH / 2 - 8}" rx="6" fill="rgba(242,184,75,.22)" stroke="#f2b84b" stroke-width="2"/>`;
        continue;
      }
      const k = locKey(loc), n = (stacks.get(k) || []).length;
      const isHit = n === 1 && stacks.get(k)[0] >= 15;
      const pt = g.stackPos(loc, isHit ? 0 : n, isHit ? 1 : n + 1);
      const top = g.isTop(loc.i);
      const x = g.ptX(loc.i), y0 = top ? G.FV : G.H - G.FV, y1 = top ? G.FV + G.PL - 8 : G.H - G.FV - G.PL + 8;
      s += `<path d="M${x - G.PW / 2 + 3},${y0} L${x},${y1} L${x + G.PW / 2 - 3},${y0} Z" fill="rgba(242,184,75,.20)"/>`;
      s += `<circle cx="${pt.x}" cy="${pt.y}" r="${G.CD / 2 - 6}" fill="rgba(242,184,75,.18)" stroke="#f2b84b" stroke-width="2.5" stroke-dasharray="${isHit ? '0' : '5 5'}"/>`;
    }
    layers.hint.innerHTML = s;
  }
  function clearDests() { dests = null; layers.hint.innerHTML = ''; }

  function mark(id, on) {
    const el = els.get(id); if (!el) return;
    let ring = el.querySelector('.mk');
    if (on && el.classList.contains('tray')) return;
    if (on && !ring) { ring = document.createElementNS(SVGNS, 'circle'); ring.setAttribute('class', 'mk'); ring.setAttribute('r', String(G.CD / 2 + 1)); ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', '#f2b84b'); ring.setAttribute('stroke-width', '2.5'); ring.setAttribute('opacity', '.85'); el.appendChild(ring); }
    if (!on && ring) ring.remove();
  }
  function setMarked(ids) { marked.forEach(id => mark(id, false)); marked = new Set(ids || []); marked.forEach(id => mark(id, true)); }

  function drawArrows(html) { layers.arrows.innerHTML = html || ''; }
  function arrowsFor(bb, p, pairs, color) { return arrowsSVG(g, bb, p, pairs, color); }

  /* ---- input ---- */
  function svgPoint(ev) {
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const m = root.getScreenCTM(); return m ? pt.matrixTransform(m.inverse()) : { x: 0, y: 0 };
  }
  function humanIdxOfId(id) {
    const loc = where.get(id);
    if (!loc) return null;
    if (loc.t === 'bar') return 24;
    if (loc.t === 'pt') return loc.i;
    return null;
  }
  function destAt(pt) {
    if (!dests) return null;
    // tray
    const tx = g.mx(G.TRAYX);
    if (dests.has(-1) && Math.abs(pt.x - tx) < G.TRAY / 2 + 10 && pt.y > G.MIDY - 20) return -1;
    let best = null, bd = 1e9;
    for (const [d] of dests) {
      if (d < 0) { const dd = Math.hypot(pt.x - tx, pt.y - (G.H - G.FV - 80)); if (dd < bd) { bd = dd; best = d; } continue; }
      const loc = locOf(0, d), x = g.ptX(loc.i), top = g.isTop(loc.i);
      const inCol = Math.abs(pt.x - x) <= G.PW / 2 && (top ? pt.y < G.MIDY + 10 : pt.y > G.MIDY - 10);
      if (inCol) return d;
      const cy = top ? G.FV + G.PL / 2 : G.H - G.FV - G.PL / 2;
      const dd = Math.hypot(pt.x - x, (pt.y - cy) * 0.6);
      if (dd < bd) { bd = dd; best = d; }
    }
    return bd < 70 ? best : null;
  }

  svg.addEventListener('pointerdown', (ev) => {
    const btn = ev.target.closest('.btn');
    if (btn) return; // handled on click
    const ce = ev.target.closest('.chk');
    if (!interactive) return;
    if (dests && !ce) {
      // tap on a highlighted destination while a checker is selected
      const pt = svgPoint(ev); const d = destAt(pt);
      if (d != null && cb.drop && drag == null && selFrom != null) { const f = selFrom; selFrom = null; clearDests(); cb.drop(f, d); return; }
    }
    if (!ce) { if (selFrom != null) { selFrom = null; clearDests(); } return; }
    let id = +ce.dataset.id;
    if (id >= 15) { // opponent checker: maybe it's a destination (hit)
      if (dests && selFrom != null) { const d = destAt(svgPoint(ev)); if (d != null) { const f = selFrom; selFrom = null; clearDests(); cb.drop(f, d); } }
      return;
    }
    let from = humanIdxOfId(id);
    if (from == null) return;
    if (dests && selFrom != null && dests.has(from) && from !== selFrom) {
      const f = selFrom; selFrom = null; clearDests(); cb.drop(f, from); return;
    }
    if (!cb.canPick(from)) { cb.cantPick && cb.cantPick(from); return; }
    // always drag the top checker of that stack
    const k = locKey(where.get(id)); const st = stacks.get(k); id = st[st.length - 1];
    const start = svgPoint(ev);
    drag = { id, from, start, moved: false, pointerId: ev.pointerId, orig: { ...posOf.get(id) } };
    svg.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  });
  svg.addEventListener('pointermove', (ev) => {
    if (!drag || ev.pointerId !== drag.pointerId) return;
    const pt = svgPoint(ev);
    if (!drag.moved) {
      if (Math.hypot(pt.x - drag.start.x, pt.y - drag.start.y) < 9) return;
      drag.moved = true;
      selFrom = null;
      showDests(drag.from, cb.dests(drag.from));
      const el = els.get(drag.id);
      layers.drag.appendChild(el);
      el.classList.add('dragging');
      el.querySelector('.disc').setAttribute('filter', 'url(#fLift)');
    }
    setXY(drag.id, pt.x, pt.y - 6, 1.08);
  });
  function endDrag(ev, cancel) {
    if (!drag || (ev && ev.pointerId !== drag.pointerId)) return;
    const d = drag; drag = null;
    const el = els.get(d.id);
    if (!d.moved) {
      if (!cancel) cb.tap(d.from);
      return;
    }
    el.classList.remove('dragging');
    el.querySelector('.disc').setAttribute('filter', 'url(#fShadow)');
    const pt = ev ? svgPoint(ev) : d.start;
    const dest = cancel ? null : destAt(pt);
    clearDests();
    if (dest != null) {
      // put checker back into its stack position logically, then let the controller move it (animates from current spot)
      cb.drop(d.from, dest, true);
    } else {
      animateTo(d.id, d.orig, 160).then(orderZ);
    }
  }
  svg.addEventListener('pointerup', (ev) => endDrag(ev, false));
  svg.addEventListener('pointercancel', (ev) => endDrag(ev, true));

  let selFrom = null;
  function select(from) {
    selFrom = from;
    showDests(from, cb.dests(from));
  }

  svg.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.btn');
    if (btn) { ev.preventDefault(); cb.button(btn.dataset.btn); }
  });
  svg.addEventListener('keydown', (ev) => {
    const btn = ev.target.closest && ev.target.closest('.btn');
    if (btn && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); cb.button(btn.dataset.btn); }
  });

  build();
  return {
    rebuild(b, o) { if (o) { flip = !!o.flip; humanLight = o.humanLight !== false; showPips = o.pips !== false; if (o.rot != null) rot = o.rot; if (o.slots) slots = o.slots; } G.setSlots(slots); build(); setPositions(b); if (diceState) drawDice(diceState); if (cubeState) drawCube(cubeState); },
    get rot() { return rot; },
    get slots() { return slots; },
    toScreen(x, y) { const m = root.getScreenCTM(); return { x: m.a * x + m.c * y + m.e, y: m.b * x + m.d * y + m.f }; },
    setPositions, moveChecker, unmoveChecker, drawDice, rollDice, drawCube, drawButtons, drawStatus, showDests, clearDests, select,
    setInteractive(v) { interactive = v; if (!v) { selFrom = null; clearDests(); } },
    setSpeed(s) { speed = s; },
    setMarked, drawArrows, arrowsFor, updateCounts,
    idsMovedLast: () => [],
    topIdAt(p, idx) { const st = stacks.get(locKey(locOf(p, idx))) || []; return st[st.length - 1]; },
    get selFrom() { return selFrom; },
    get dragging() { return !!drag; }
  };
}

/* ===================== NET (play a friend) =====================
   Uses the page's live room. Each player publishes, in their presence, the last
   few actions they made (numbered); the other side applies any it hasn't seen.

  let busy = false;    // animation lock
  let turnInfo = null; // rules info for human's current roll
  let partial = [];    // human submoves this turn [{from,to,die,hit,snap}]
  let rem = [];        // remaining dice values
  let order = [0, 1];  // display order of dice indices
  let phase = 'idle';  // idle | opening | preroll | moving | cubeOffer | botTurn | tutor | over
  let pendingCube = null; // promise for human cube analysis
  let lastBotIds = [];
  let resignOffered = 0;
  let pendingRecord = null; // move record in progress (tutor first attempt)
  const ui = {}; // hooks set by UI layer

  const cur = () => M && M.cur;
  const friend = () => !!(M && M.opp === 'friend');
  const oppName = () => friend() ? (M.oppName = Net.oppName) : 'Bot';
  const game = () => M && M.games[M.games.length - 1];

  function ctxFor(p) {
    const c = cur(), g = game();
    return {
      matchTo: M.matchTo, sMe: M.score[p], sOpp: M.score[1 - p],
      cube: c.cube.value, owner: c.cube.owner === -1 ? -1 : (c.cube.owner === p ? 1 : 0),
      crawford: !!g.crawford, jacoby: !!(M.matchTo === 0 && M.jacoby && M.cubeOn), cubeful: !!M.cubeOn
    };
  }
  const sides = (p) => { const b = cur().b; return { me: b[p], opp: b[1 - p] }; };
  function canDouble(p) {
    if (!M.cubeOn) return false;
    const c = cur(), g = game();
    if (g.crawford) return false;
    if (c.cube.owner !== -1 && c.cube.owner !== p) return false;
    if (M.matchTo && M.score[p] + c.cube.value >= M.matchTo) return false; // dead cube for doubler
    return true;
  }

  function save() {
    if (!M) return;
    try { M.savedAt = Date.now(); Store.set('current', M); } catch (e) { }
  }

  /* ---------- analysis ---------- */
  const ANALYSIS_MAX_CANDS = 8;
  function compactMoves(res, playedIdx) {
    const keep = res.moves.slice(0, ANALYSIS_MAX_CANDS).map((m, i) => ({ ...m, i }));
    if (playedIdx >= ANALYSIS_MAX_CANDS && res.moves[playedIdx]) keep.push({ ...res.moves[playedIdx], i: playedIdx });
    return keep.map(m => ({ m: m.move, eq: +m.eq.toFixed(5), pr: m.probs.map(x => +x.toFixed(4)), ply: m.ply, i: m.i }));
  }
  // fg = someone is waiting for this (tutor): use the play pool; otherwise background engine
  async function analyseMove(rec, precomputed, fg) {
    const me = rec.b[rec.p], opp = rec.b[1 - rec.p];
    try {
      if (rec.forcedNone) { rec.an = { cands: [], played: -1, loss: 0, total: 0 }; }
      else {
        const played = R.toGnubg(rec.subs);
        const res = precomputed || (fg ? await Play.moves(opp, me, rec.dice[0], rec.dice[1], rec.ctx, aLevel(), played)
          : await Engine.call('moves', opp, me, rec.dice[0], rec.dice[1], rec.ctx, aLevel(), played));
        let pi = precomputed ? 0 : res.played;
        if (pi < 0) pi = 0;
        // best = highest eq among full-ply moves
        let best = res.moves[0];
        for (const m of res.moves) if (m.ply >= best.ply && m.eq > best.eq) best = m;
        const loss = Math.max(0, best.eq - res.moves[pi].eq);
        rec.an = { cands: compactMoves(res, pi), played: pi, loss: +loss.toFixed(5), total: res.total };
        rec.alv = aLevel();
      }
      if (rec.luck == null) {
        const L = await Engine.call('luck', opp, me, rec.dice[0], rec.dice[1], rec.ctx);
        rec.luck = +L.luck.toFixed(5);
        if (M.matchTo) {
          const hi = await Engine.call('eq2mwc', 1, rec.ctx), lo = await Engine.call('eq2mwc', -1, rec.ctx);
          rec.mwcK = +((hi - lo) / 2).toFixed(5);
        }
      }
    } catch (e) { console.warn('analysis failed', e); }
    return rec;
  }
  function cubeLoss(rec) {
    const a = rec.an; if (!a) return null;
    if (rec.k === 'cube') {
      const dbl = Math.min(a.dt, a.dp);
      const opt = Math.max(a.nd, dbl);
      const got = rec.action === 'double' ? dbl : a.nd;
      return Math.max(0, opt - got);
    } else { // take decision, a is from doubler perspective
      const best = Math.min(a.dt, a.dp);
      const got = rec.action === 'take' ? a.dt : a.dp;
      return Math.max(0, got - best);
    }
  }
  async function analyseCube(rec, pre) {
    try {
      const a = pre || await Engine.call('cube', rec.b[1 - rec.doubler], rec.b[rec.doubler], rec.ctx, aLevel());
      rec.an = { nd: +a.nd.toFixed(5), dt: +a.dt.toFixed(5), dp: +a.dp.toFixed(5), optimal: +a.optimal.toFixed(5), cd: a.cd, close: a.close, pr: a.probs.map(x => +x.toFixed(4)) };
      rec.loss = +cubeLoss(rec).toFixed(5);
      rec.counted = rec.k === 'take' || rec.action === 'double' || rec.an.close || rec.loss > 0.0005;
    } catch (e) { console.warn('cube analysis failed', e); }
    return rec;
  }
  // engine 'cube' wants (opp, me) for the doubler on roll
  function cubeCall(doubler, ctx, fg) {
    const b = cur().b;
    return (fg ? Play : Engine).call('cube', b[1 - doubler], b[doubler], ctx, aLevel());
  }
  // (analysis level follows the bot's level, so the bot's own cube decisions use it too)
  async function ensureAnalysis(rec) {
    if (rec.k === 'move' && (!rec.an || rec.luck == null)) await analyseMove(rec);
    else if ((rec.k === 'cube' || rec.k === 'take') && !rec.an) {
      const a = await Engine.call('cube', rec.b[1 - rec.doubler], rec.b[rec.doubler], rec.ctx, aLevel());
      await analyseCube(rec, a);
    }
    return rec;
  }

  /* ---------- match lifecycle ---------- */
  function newMatch(opts) {
    M = {
      id: 'm' + Date.now().toString(36), created: Date.now(), mode: opts.mode, matchTo: opts.matchTo, cubeOn: opts.cubeOn,
      jacoby: opts.jacoby, level: opts.level, score: [0, 0], crawfordUsed: false, games: [], cur: null, over: false, winner: null,
      opp: opts.opp || 'bot', net: opts.net || null, oppName: opts.oppName || ''
    };
    if (friend()) { M.mode = 'normal'; Net.setHooks(netHooks()); }
    startGame();
  }
  function startGame() {
    const g = { no: M.games.length + 1, startScore: M.score.slice(), crawford: false, recs: [], result: null };
    if (M.matchTo && M.cubeOn && !M.crawfordUsed && (M.score[0] === M.matchTo - 1 || M.score[1] === M.matchTo - 1)) { g.crawford = true; M.crawfordUsed = true; }
    M.games.push(g);
    M.cur = { b: [R.startSide(), R.startSide()], turn: -1, cube: { value: 1, owner: -1 }, dice: null, opening: true };
    resignOffered = 0;
    lastBotIds = [];
    render(true);
    save();
    ui.update && ui.update();
    openingRoll();
  }

  function render(full) {
    const c = cur();
    board.setSpeed(SPEEDS[Settings.speed] || 1);
    board.rebuild(c.b, { flip: Settings.flip, humanLight: Settings.humanLight, pips: Settings.pips, rot: boardRot(), slots: boardSlots() });
    board.drawCube({ on: M.cubeOn && !game().crawford, value: c.cube.value, owner: c.cube.owner });
    board.drawDice(null);
    board.drawButtons([]);
    board.drawStatus(0, ''); board.drawStatus(1, '');
    board.drawArrows('');
  }

  async function openingRoll() {
    if (friend()) return friendOpening();
    phase = 'opening';
    busy = true;
    let a, b;
    do {
      a = rollDie(); b = rollDie();
      await board.rollDice({ single: [[0, a], [1, b]] }, Settings.diceAnim ? 320 : 0);
      if (a === b) { ui.toast && ui.toast(`Both rolled ${a}. Rolling again`); await sleep(650); }
    } while (a === b);
    await sleep(420);
    const p = a > b ? 0 : 1;
    const dice = p === 0 ? [a, b] : [b, a];
    cur().opening = false;
    busy = false;
    if (p === 0) await humanRolled(dice, true);
    else await botPlay(dice, true);
  }

  // Roll sits alone in the middle of your half; Double lives on the cube (and, in the
  // portrait button bar, at the far end away from Roll).
  function prerollButtons(dbl) {
    const b = [{ id: 'roll', label: 'Roll', kind: 'primary', side: 0, slot: 'center', w: 120, aria: 'Roll the dice' }];
    if (dbl) b.push({ id: 'double', label: 'Double', kind: 'accent', htmlOnly: true, aria: 'Offer a double' });
    return b;
  }
  function drawCubeNow(canDbl, animate) {
    const c = cur();
    board.drawCube({ on: M.cubeOn && !game().crawford, value: c.cube.value, owner: c.cube.owner, canDouble: !!canDbl }, animate);
  }
  /* ---------- human turn ---------- */
  async function humanPreRoll() {
    phase = 'preroll';
    const c = cur();
    c.turn = 0; c.dice = null;
    board.drawDice(null);
    save();
    ui.update && ui.update();
    const dbl = canDouble(0);
    pendingCube = dbl ? cubeCall(0, ctxFor(0), M.mode === 'tutor' || !friend()) : null;
    if (!dbl && Settings.autoRoll) { await sleep(120); return doRoll(); }
    board.drawButtons(prerollButtons(dbl));
    if (dbl) drawCubeNow(true);
  }

  async function doRoll(skipCubeRecord) {
    if (!skipCubeRecord && phase !== 'preroll') return;
    phase = 'rolling';
    board.drawButtons([]);
    drawCubeNow(false);
    if (canDouble(0) && !skipCubeRecord) {
      // record the "no double" decision
      const rec = { k: 'cube', p: 0, doubler: 0, action: 'nodouble', b: clone(cur().b), ctx: ctxFor(0) };
      game().recs.push(rec);
      if (M.mode === 'tutor') {
        const a = await pendingCube;
        await analyseCube(rec, a);
        if (rec.loss != null && tutorFlag(rec.loss)) {
          phase = 'tutor';
          const choice = await ui.tutorCube(rec, 'nodouble');
          phase = 'rolling';
          if (choice === 'switch') { rec.tutorSwitched = true; return doDouble(true); }
        }
      } else if (pendingCube) pendingCube.then(a => analyseCube(rec, a)).catch(() => { });
    }
    const d = [rollDie(), rollDie()];
    if (friend()) Net.send({ t: 'roll', d });
    await humanRolled(d, false);
  }

  async function humanRolled(dice, opening) {
    phase = 'moving';
    const c = cur();
    c.turn = 0; c.dice = dice;
    // the larger die always comes first; tapping the dice swaps them for this roll only
    order = dice[0] >= dice[1] ? [0, 1] : [1, 0];
    partial = []; rem = R.diceList(dice[0], dice[1]);
    const { me, opp } = sides(0);
    turnInfo = R.turnInfo(me, opp, dice[0], dice[1]);
    pendingRecord = { k: 'move', p: 0, dice: dice.slice(), b: clone(c.b), ctx: ctxFor(0), subs: [] };
    if (turnInfo.maxTotal === 0) {
      phase = 'auto';
      pendingRecord.forcedNone = true;
      // shut out completely (no roll at all could move): skip straight on.
      // Otherwise show the roll so it is clear what was rolled, then pass the turn.
      if (!opening && !shutOut(me, opp)) {
        busy = true;
        await board.rollDice(diceView(dice), Settings.diceAnim ? 300 : 0);
        ui.toast && ui.toast('No legal move with ' + dice.join('-'));
        await sleep(1100);
        busy = false;
      }
      return commitHuman(true);
    }
    if (!opening) { busy = true; await board.rollDice(diceView(dice), Settings.diceAnim ? 300 : 0); busy = false; }
    else board.drawDice(diceView(dice));
    save();
    ui.update && ui.update();
    if (turnInfo.finals.size === 1 && Settings.autoForced) {
      const seq = [...turnInfo.finals.values()][0];
      phase = 'auto';
      await sleep(250);
      busy = true;
      for (const s of seq) await playStep(s.from, s.die, true);
      busy = false;
      await sleep(200);
      return commitHuman(true);
    }
    board.setInteractive(true);
    drawMoveButtons();
  }

  function diceView(dice) {
    const vals = dice[0] === dice[1] ? [dice[0], dice[0], dice[0], dice[0]] : dice.slice();
    return { p: 0, vals, used: vals.map(() => false), order: order.slice() };
  }
  function usedFlags(vals) {
    if (!rem) return vals.map(() => false);
    if (vals.length === 4) { const n = 4 - rem.length; return vals.map((_, i) => i < n); }
    const r = rem.slice();
    return vals.map(v => { const i = r.indexOf(v); if (i >= 0) { r.splice(i, 1); return false; } return true; });
  }
  function drawMoveButtons() {
    const c = cur();
    if (!c.dice) return;
    board.drawDice({ p: 0, vals: c.dice[0] === c.dice[1] ? [c.dice[0], c.dice[0], c.dice[0], c.dice[0]] : c.dice.slice(), used: usedFlags(c.dice[0] === c.dice[1] ? [c.dice[0], c.dice[0], c.dice[0], c.dice[0]] : c.dice), order: order.slice() });
    const btns = [];
    if (partial.length) btns.push({ id: 'undo', label: 'Undo', kind: 'ghost', side: 0, slot: 'farleft', w: 100, aria: 'Undo last checker move' });
    if (turnInfo && partial.length === turnInfo.maxTotal) btns.push({ id: 'done', label: 'Done', kind: 'accent', side: 0, slot: 'farright', w: 100, aria: 'Confirm move' });
    board.drawButtons(btns);
    ui.update && ui.update();
  }

  function preferredDice() {
    const c = cur();
    if (c.dice[0] === c.dice[1]) return [c.dice[0]];
    return order.map(i => c.dice[i]);
  }
  function canPick(from) {
    if (phase !== 'moving' || busy || !turnInfo) return false;
    const { me, opp } = sides(0);
    if (!me[from]) return false;
    for (const d of new Set(rem)) if (R.stepLegal(turnInfo, me, opp, rem, partial.length, from, d)) return true;
    return false;
  }
  function dests(from) {
    if (!turnInfo) return new Map();
    const { me, opp } = sides(0);
    return R.destinations(turnInfo, me, opp, rem, partial.length, from, preferredDice());
  }
  async function tap(from) {
    if (phase !== 'moving' || busy || !turnInfo) return;
    const { me, opp } = sides(0);
    // bearing off: prefer the smallest die that takes the checker off
    const offDice = [...new Set(rem)].sort((a, b) => a - b).filter(d => R.subDest(me, opp, from, d) === -1 && R.stepLegal(turnInfo, me, opp, rem, partial.length, from, d));
    if (offDice.length > 1) { busy = true; await playStep(from, offDice[0]); busy = false; afterStep(); return; }
    for (const d of preferredDice().concat(rem)) {
      if (!rem.includes(d)) continue;
      if (R.stepLegal(turnInfo, me, opp, rem, partial.length, from, d)) { busy = true; await playStep(from, d); busy = false; afterStep(); return; }
    }
  }
  async function drop(from, dest) {
    if (phase !== 'moving' || busy || !turnInfo) return;
    const path = dests(from).get(dest);
    if (!path) return;
    busy = true;
    for (const st of path) await playStep(st.from, st.d, false, path.length > 1 ? 170 : 200);
    busy = false;
    afterStep();
  }
  async function playStep(from, d, auto, dur) {
    const c = cur();
    const snap = clone(c.b);
    const s = R.applySub(c.b[0], c.b[1], from, d);
    partial.push({ ...s, snap });
    rem = R.removeOne(rem, d);
    board.setMarked([]);
    await board.moveChecker(0, from, s.to, s.hit, { dur });
    if (auto) drawMoveButtons();
  }
  function afterStep() {
    drawMoveButtons();
    if (turnInfo && partial.length === turnInfo.maxTotal && rem.length >= 0) {
      // all usable dice played: nothing else to do; wait for Done (tap dice also confirms)
    }
  }
  async function undo() {
    if (phase !== 'moving' || busy || !partial.length) return;
    busy = true;
    const s = partial.pop();
    cur().b = s.snap;
    rem.push(s.die);
    await board.unmoveChecker(0, s.from, s.to, s.hit);
    busy = false;
    drawMoveButtons();
  }
  async function undoAll(fast) {
    busy = true;
    while (partial.length) {
      const s = partial.pop();
      cur().b = s.snap;
      rem.push(s.die);
      await board.unmoveChecker(0, s.from, s.to, s.hit);
    }
    busy = false;
  }
  function swapDice() {
    const c = cur();
    if (phase !== 'moving' || busy || !c.dice || c.dice[0] === c.dice[1]) return;
    if (partial.length) return;
    order = [order[1], order[0]];
    drawMoveButtons();
  }
  async function diceTap() {
    if (phase !== 'moving') return;
    if (turnInfo && partial.length === turnInfo.maxTotal) return confirmMove();
    swapDice();
  }

  async function confirmMove() {
    if (phase !== 'moving' || busy || !turnInfo) return;
    if (partial.length !== turnInfo.maxTotal) return;
    return commitHuman(false);
  }

  function tutorFlag(loss) { return Settings.tutorAny ? loss > 0.001 : loss >= SKILL.doubtful; }

  async function commitHuman(forced) {
    phase = 'committing';
    board.setInteractive(false);
    board.drawButtons([]);
    const rec = pendingRecord;
    const subsNow = partial.map(s => ({ from: s.from, to: s.to, die: s.die, hit: s.hit }));
    if (!rec.tutorDone) rec.subs = subsNow;   // the first attempt is what counts
    rec.forced = forced || (turnInfo && turnInfo.finals.size <= 1);
    if (M.mode === 'tutor' && !rec.forced && !rec.forcedNone && !rec.tutorDone) {
      phase = 'tutor';
      board.drawStatus(0, 'Checking your move');
      await analyseMove(rec, null, true);
      board.drawStatus(0, '');
      rec.tutorDone = true;
      if (rec.an && tutorFlag(rec.an.loss)) {
        const choice = await ui.tutorMove(rec);
        board.drawArrows('');
        if (choice === 'retry') {
          if (partial.length) await undoAll();
          rec.retried = true;
          phase = 'moving';
          board.setInteractive(true);
          drawMoveButtons();
          return; // stays pending; first attempt already analysed
        }
        if (choice === 'best') {
          if (partial.length) await undoAll();
          await playPairs(rec.an.cands[0].m);
          rec.playedBest = true;
        } else if (choice === 'keep' && !partial.length) {
          await playPairs(R.toGnubg(rec.subs).filter(x => x !== -1 || true).slice(0, rec.subs.length * 2));
        }
      }
    } else if (!rec.an) {
      analyseMove(rec); // background
    }
    game().recs.push(rec);
    if (friend()) Net.send({ t: 'move', m: rec.forcedNone ? [] : R.toGnubg(rec.subs).slice(0, rec.subs.length * 2) });
    pendingRecord = null;
    cur().dice = null;
    board.drawDice(null);
    turnInfo = null; partial = [];
    if (checkWin(0)) return;
    save();
    await sleep(120);
    if (friend()) friendTurn(); else botTurn();
  }
  // play gnubg-style pairs for the human (used for tutor "best" / "keep")
  async function playPairs(pairs) {
    busy = true;
    const { subs } = R.simulatePairs(cur().b[0], cur().b[1], pairs);
    for (const s of subs) {
      const c = cur(), snap = clone(c.b);
      const die = s.to >= 0 ? s.from - s.to : bestDieFor(s.from);
      const r = R.applySub(c.b[0], c.b[1], s.from, die);
      partial.push({ ...r, snap }); rem = R.removeOne(rem, die);
      await board.moveChecker(0, s.from, r.to, r.hit);
    }
    busy = false;
  }
  // tutor: rewind to the start of the turn and show your move (amber) vs the best move (green)
  async function previewBest(rec) {
    if (partial.length) await undoAll();
    const b = cur().b;
    const best = rec.an.cands[0].m;
    board.drawArrows(board.arrowsFor(b, 0, R.toGnubg(rec.subs).slice(0, rec.subs.length * 2), 'amber') + board.arrowsFor(b, 0, best, 'green'));
  }
  function bestDieFor(from) {
    // bearing off with a larger die: pick the smallest remaining die that bears off legally
    const { me, opp } = sides(0);
    const ds = [...new Set(rem)].sort((a, b) => a - b);
    for (const d of ds) if (R.subDest(me, opp, from, d) === -1) return d;
    return ds[ds.length - 1];
  }

  async function doDouble(fromTutor) {
    if (!fromTutor && phase !== 'preroll') return;
    phase = 'doubling';
    board.drawButtons([]);
    drawCubeNow(false);
    const a = await pendingCube;
    const rec = { k: 'cube', p: 0, doubler: 0, action: 'double', b: clone(cur().b), ctx: ctxFor(0) };
    await analyseCube(rec, a);
    if (!fromTutor) {
      game().recs.push(rec);
      if (M.mode === 'tutor' && rec.loss != null && tutorFlag(rec.loss)) {
        phase = 'tutor';
        const choice = await ui.tutorCube(rec, 'double');
        phase = 'doubling';
        if (choice === 'switch') { rec.tutorSwitched = true; return doRoll(true); }
      }
    }
    phase = 'cubeOffer';
    const c = cur();
    Sound.play('cube');
    board.drawCube({ on: true, value: c.cube.value, owner: c.cube.owner, offeredTo: 1, prev: null }, true);
    let take;
    if (friend()) {
      Net.send({ t: 'dbl' });
      board.drawStatus(1, `${oppName()} is deciding`);
      let act;
      do { act = await Net.next(); } while (act.t !== 'take' && act.t !== 'pass');
      take = act.t === 'take';
    } else {
      board.drawStatus(1, 'Considering…');
      await sleep(500);
      // bot decides: take if doubler's equity when taken < when passed
      take = rec.an ? rec.an.dt < rec.an.dp : true;
    }
    const trec = { k: 'take', p: 1, doubler: 0, action: take ? 'take' : 'pass', b: clone(c.b), ctx: ctxFor(0) };
    await analyseCube(trec, a);
    game().recs.push(trec);
    board.drawStatus(1, '');
    if (!take) {
      ui.toast && ui.toast(`${oppName()} passes`);
      await sleep(500);
      return endGame(0, c.cube.value, 'pass');
    }
    ui.toast && ui.toast(`${oppName()} takes`);
    c.cube.value *= 2; c.cube.owner = 1;
    board.drawCube({ on: true, value: c.cube.value, owner: 1 }, true);
    save();
    ui.update && ui.update();
    await sleep(350);
    const d = [rollDie(), rollDie()];
    if (friend()) Net.send({ t: 'roll', d });
    await humanRolled(d, false);
  }

  /* ---------- bot turn ---------- */
  async function botTurn() {
    phase = 'botTurn';
    const c = cur();
    c.turn = 1; c.dice = null;
    ui.update && ui.update();
    board.setMarked([]);
    // resignation check + cube decision
    let ca = null;
    if (canDouble(1)) {
      ca = await cubeCall(1, ctxFor(1), true);
      const rec = { k: 'cube', p: 1, doubler: 1, action: 'nodouble', b: clone(c.b), ctx: ctxFor(1) };
      const doubles = [0, 1, 5, 7, 8, 16, 17, 18, 19, 20].includes(ca.cd);
      rec.action = doubles ? 'double' : 'nodouble';
      await analyseCube(rec, ca);
      game().recs.push(rec);
      if (doubles) {
        const res = await humanCubeResponse(ca);
        if (res === 'pass') return;
      }
    }
    // the bot resigns only when winning has become mathematically impossible
    const lvl = certainLoss(c.b[1], c.b[0]);
    if (lvl && lvl !== resignOffered) {
      resignOffered = lvl;
      const ok = await ui.botResigns(lvl);
      if (ok) return endGame(0, lvl, 'resign');
    }
    const d = [rollDie(), rollDie()];
    await botPlay(d, false);
  }
  // Bot (side `me`, on roll) vs human (`opp`). Returns 0, 1 (single) or 2 (gammon) when the
  // bot cannot win even if it rolls 6-6 every turn and the human rolls 2-1 every turn.
  function certainLoss(me, opp) {
    if (me[24] || opp[24]) return 0;
    let mMax = -1, oMax = -1;
    for (let i = 0; i < 24; i++) { if (me[i]) mMax = i; if (opp[i]) oMax = i; }
    if (mMax + oMax >= 23) return 0; // still contact: anything can happen
    // human: an achievable number of turns rolling 2-1 every time (upper bound)
    const hTurns = turnsWithRoll(opp, 2, 1);
    // bot: a lower bound on turns with 6-6 every time
    const n = 15 - R.off(me);
    const botTurns = Math.max(Math.ceil(R.pips(me) / 24), Math.ceil(n / 4));
    // bot rolls first; it wins if it finishes on its turn k <= human's finishing turn
    if (botTurns <= hTurns) return 0;
    if (R.off(me) === 0) {
      let outside = 0;
      for (let i = 6; i < 24; i++) outside += me[i] * (i - 5);
      const firstOff = Math.ceil((outside + 1) / 24);
      if (firstOff > hTurns) {
        // backgammon too if it can't even get every checker out of your home board in time
        let stuck = 0, nStuck = 0;
        for (let i = 18; i < 24; i++) { stuck += me[i] * (i - 17); nStuck += me[i]; }
        if (nStuck && Math.max(Math.ceil(stuck / 24), Math.ceil(nStuck / 4)) > hTurns) return 3;
        return 2;
      }
    }
    return 1;
  }
  function turnsWithRoll(side, d0, d1) {
    let me = side.slice(), opp = Array(25).fill(0), turns = 0;
    while (R.off(me) < 15 && turns < 200) {
      const ti = R.turnInfo(me, opp, d0, d1);
      let best = null, bp = 1e9;
      for (const seq of ti.finals.values()) {
        const m = me.slice(), o = opp.slice();
        for (const st of seq) R.applySub(m, o, st.from, st.die);
        const score = R.pips(m) * 20 - R.off(m);
        if (score < bp) { bp = score; best = m; }
      }
      if (best) me = best;
      turns++;
    }
    return turns;
  }
  async function humanCubeResponse(ca) {
    const c = cur();
    phase = 'cubeOffer';
    Sound.play('cube');
    board.drawCube({ on: true, value: c.cube.value, owner: c.cube.owner, offeredTo: 0 }, true);
    const choice = await new Promise(res => {
      ui._cubeResolve = res;
      board.drawButtons([
        { id: 'take', label: 'Take', kind: 'primary', side: 0, slot: 'left', w: 112, aria: 'Take the double', dy: 70 },
        { id: 'pass', label: 'Pass', kind: 'ghost', side: 0, slot: 'right', w: 112, aria: 'Pass the double', dy: 70 }
      ]);
      ui.toast && ui.toast(`${oppName()} doubles to ${c.cube.value * 2}`);
    });
    board.drawButtons([]);
    const rec = { k: 'take', p: 0, doubler: 1, action: choice, b: clone(c.b), ctx: ctxFor(1) };
    await analyseCube(rec, ca);
    let final = choice;
    if (!friend() && M.mode === 'tutor' && rec.loss != null && tutorFlag(rec.loss)) {
      const t = await ui.tutorCube(rec, choice);
      if (t === 'switch') { final = choice === 'take' ? 'pass' : 'take'; rec.tutorSwitched = true; }
    }
    game().recs.push(rec);
    if (friend()) Net.send({ t: final });
    if (final === 'pass') { await endGame(1, c.cube.value, 'pass'); return 'pass'; }
    c.cube.value *= 2; c.cube.owner = 0;
    board.drawCube({ on: true, value: c.cube.value, owner: 0 }, true);
    save();
    ui.update && ui.update();
    await sleep(250);
    return 'take';
  }

  async function botPlay(dice, opening) {
    phase = 'botTurn';
    const c = cur();
    c.turn = 1; c.dice = dice;
    ui.update && ui.update();
    if (!opening && R.turnInfo(c.b[1], c.b[0], dice[0], dice[1]).maxTotal === 0) {
      // the bot cannot move: show the roll unless no roll at all could move, then go to your turn
      if (!shutOut(c.b[1], c.b[0])) {
        await board.rollDice({ p: 1, vals: dice[0] === dice[1] ? [dice[0], dice[0], dice[0], dice[0]] : dice.slice(), used: [false, false, false, false], order: [0, 1] }, Settings.diceAnim ? 300 : 0);
        ui.toast && ui.toast(oppName() + ' can’t move with ' + dice.join('-'));
        await sleep(1100);
        board.drawDice(null);
      }
      const rec = { k: 'move', p: 1, dice: dice.slice(), b: clone(c.b), ctx: ctxFor(1), subs: [], forcedNone: true };
      analyseMove(rec);
      game().recs.push(rec);
      c.dice = null;
      save();
      return humanPreRoll();
    }
    if (!opening) await board.rollDice({ p: 1, vals: dice[0] === dice[1] ? [dice[0], dice[0], dice[0], dice[0]] : dice.slice(), used: [false, false, false, false], order: [0, 1] }, Settings.diceAnim ? 300 : 0);
    else board.drawDice({ p: 1, vals: dice.slice(), used: [false, false], order: [0, 1] });
    const ctx = ctxFor(1);
    const me = c.b[1], opp = c.b[0];
    const rec = { k: 'move', p: 1, dice: dice.slice(), b: clone(c.b), ctx, subs: [] };
    const t0 = performance.now();
    let thinking = setTimeout(() => board.drawStatus(1, 'Thinking'), 500);
    let res;
    try { res = await Play.moves(opp, me, dice[0], dice[1], ctx, M.level || 5); }
    catch (e) { ui.toast && ui.toast('Engine error: ' + e.message); return; }
    clearTimeout(thinking); board.drawStatus(1, '');
    const el = performance.now() - t0;
    if (el < 380) await sleep(380 - el);
    if (!res.moves.length) {
      rec.forcedNone = true;
    } else {
      const best = res.moves[0].move;
      const { subs } = R.simulatePairs(me, opp, best);
      const ids = [];
      for (let i = 0; i < subs.length; i++) {
        const s = subs[i];
        const sim = R.simulatePairs(c.b[1], c.b[0], [s.from, s.to]);
        c.b[1] = sim.me; c.b[0] = sim.opp;
        const id = await board.moveChecker(1, s.from, s.to, s.hit);
        ids.push(id);
        await sleep(60);
      }
      rec.subs = subs.map(s => ({ from: s.from, to: s.to, die: s.die, hit: s.hit }));
      rec.forced = res.total <= 1;
      lastBotIds = ids.filter(x => x != null);
      board.setMarked(lastBotIds);
      // analysis: reuse when bot plays at analysis level
      if ((M.level || 5) === aLevel()) analyseMove(rec, res); else analyseMove(rec);
      rec.alv = aLevel();
    }
    if (rec.forcedNone) analyseMove(rec);
    game().recs.push(rec);
    await sleep(250);
    c.dice = null;
    board.drawDice(null);
    if (checkWin(1)) return;
    save();
    humanPreRoll();
  }

  /* ---------- friend (remote player) ---------- */
  function netHooks() {
    return {
      status: (k) => {
        if (k === 'gone') { ui.toast && ui.toast(`${oppName()} disconnected. Waiting for them to come back`); board.drawStatus(1, `Waiting for ${oppName()}`); }
        if (k === 'back') { ui.toast && ui.toast(`${oppName()} is back`); board.drawStatus(1, ''); }
        ui.update && ui.update();
      }
    };
  }
  async function friendOpening() {
    phase = 'opening';
    const c = cur();
    let mine, theirs;
    if (M.net.role === 'host') {
      if (!c.openMsg) {
        let a, b;
        do { a = rollDie(); b = rollDie(); } while (a === b);
        c.openMsg = { a, b };
        Net.send({ t: 'open', a, b, g: game().no });
        save();
      }
      mine = c.openMsg.a; theirs = c.openMsg.b;
    } else {
      board.drawStatus(1, `Waiting for ${oppName()}`);
      let act;
      do { act = await Net.next(); } while (act.t !== 'open');
      board.drawStatus(1, '');
      mine = act.b; theirs = act.a;
    }
    busy = true;
    await board.rollDice({ single: [[0, mine], [1, theirs]] }, Settings.diceAnim ? 320 : 0);
    await sleep(420);
    busy = false;
    c.opening = false;
    if (mine > theirs) await humanRolled([mine, theirs], true);
    else { await remotePlay([theirs, mine], true); }
  }
  // Their turn: wait for what they do next (double, roll, resign).
  async function friendTurn() {
    phase = 'remote';
    const c = cur();
    c.turn = 1; c.dice = null;
    ui.update && ui.update();
    board.setMarked([]);
    save();
    board.drawStatus(1, Net.connected ? '' : `Waiting for ${oppName()}`);
    while (true) {
      const act = await Net.next();
      if (act.t === 'dbl') {
        const ca = await cubeCall(1, ctxFor(1));
        const rec = { k: 'cube', p: 1, doubler: 1, action: 'double', b: clone(c.b), ctx: ctxFor(1) };
        await analyseCube(rec, ca);
        game().recs.push(rec);
        const res = await humanCubeResponse(ca);
        if (res === 'pass') return;
        phase = 'remote';
        continue;
      }
      if (act.t === 'resign') {
        const ok = await ui.botResigns(act.l, oppName());
        Net.send({ t: ok ? 'racc' : 'rdec' });
        if (ok) return endGame(0, act.l, 'resign');
        continue;
      }
      if (act.t === 'roll') {
        if (canDouble(1)) {
          const rec = { k: 'cube', p: 1, doubler: 1, action: 'nodouble', b: clone(c.b), ctx: ctxFor(1) };
          game().recs.push(rec);
          cubeCall(1, ctxFor(1)).then(a => analyseCube(rec, a)).catch(() => { });
        }
        return remotePlay(act.d, false);
      }
    }
  }
  // true when no roll at all (all 21) would give this side a legal move, e.g. on the bar against a closed board
  function shutOut(me, opp) {
    for (let a = 1; a <= 6; a++) for (let b = a; b <= 6; b++) if (R.turnInfo(me, opp, a, b).maxTotal > 0) return false;
    return true;
  }
  async function remotePlay(dice, opening) {
    phase = 'remote';
    const c = cur();
    c.turn = 1; c.dice = dice;
    ui.update && ui.update();
    const ctx = ctxFor(1);
    const rec = { k: 'move', p: 1, dice: dice.slice(), b: clone(c.b), ctx, subs: [] };
    const canMove = R.turnInfo(c.b[1], c.b[0], dice[0], dice[1]).maxTotal > 0;
    if (canMove || !shutOut(c.b[1], c.b[0])) {
      if (!opening) await board.rollDice({ p: 1, vals: dice[0] === dice[1] ? [dice[0], dice[0], dice[0], dice[0]] : dice.slice(), used: [false, false, false, false], order: [0, 1] }, Settings.diceAnim ? 300 : 0);
      else board.drawDice({ p: 1, vals: dice.slice(), used: [false, false], order: [0, 1] });
    }
    let act;
    do { act = await Net.next(); } while (act.t !== 'move');
    const pairs = Array.isArray(act.m) ? act.m.slice(0, 8).map(x => x | 0) : [];
    if (!pairs.length) rec.forcedNone = true;
    else {
      const { subs } = R.simulatePairs(c.b[1], c.b[0], pairs);
      const ids = [];
      for (const s of subs) {
        const sim = R.simulatePairs(c.b[1], c.b[0], [s.from, s.to]);
        c.b[1] = sim.me; c.b[0] = sim.opp;
        ids.push(await board.moveChecker(1, s.from, s.to, s.hit));
        await sleep(60);
      }
      rec.subs = subs.map(s => ({ from: s.from, to: s.to, die: s.die, hit: s.hit }));
      lastBotIds = ids.filter(x => x != null);
      board.setMarked(lastBotIds);
    }
    analyseMove(rec);
    game().recs.push(rec);
    await sleep(200);
    c.dice = null;
    board.drawDice(null);
    if (checkWin(1)) return;
    save();
    humanPreRoll();
  }

  /* ---------- game end ---------- */
  function checkWin(p) {
    const c = cur();
    if (R.off(c.b[p]) < 15) return false;
    let lvl = R.gameValue(c.b[1 - p]);
    if (M.matchTo === 0 && M.jacoby && M.cubeOn && c.cube.value === 1 && c.cube.owner === -1) lvl = 1;
    endGame(p, lvl * c.cube.value, ['', 'single', 'gammon', 'backgammon'][lvl], lvl);
    return true;
  }
  async function endGame(winner, points, how, lvl) {
    phase = 'over';
    board.setInteractive(false);
    board.drawButtons([]);
    const g = game(), c = cur();
    if (how === 'resign') {
      let lv = points;
      const jac = M.matchTo === 0 && M.jacoby && M.cubeOn && c.cube.value === 1 && c.cube.owner === -1;
      how = ['', 'single game', 'gammon', 'backgammon'][lv] + ' resigned';
      if (jac) lv = 1;
      points = lv * c.cube.value;
    }
    if (how === 'pass') how = 'double passed';
    g.result = { winner, points, how, cube: c.cube.value };
    M.score[winner] += points;
    if (M.matchTo && M.score[winner] >= M.matchTo) { M.over = true; M.winner = winner; }
    if (!M.matchTo) { M.over = true; M.winner = winner; }
    save();
    ui.update && ui.update();
    await sleep(350);
    ui.gameOver && ui.gameOver(g, M);
    if (M.over) { archive(); if (friend()) rematchListen(M); }
  }
  /* ---------- rematch: same settings again (and the same friend, over the same connection) ---------- */
  let rm = null;   // { M, mine, theirs } for the finished friend match
  function rematchOpts(m) {
    return { mode: m.mode, matchTo: m.matchTo, cubeOn: m.cubeOn, jacoby: m.jacoby, level: m.level, opp: m.opp, net: m.opp === 'friend' ? Net.state : null, oppName: m.oppName };
  }
  async function rematchListen(myM) {
    rm = { M: myM, mine: false, theirs: false };
    while (true) {
      let act;
      try { act = await Net.next(); } catch (e) { return; }
      if (!rm || rm.M !== myM || M !== myM) return;
      if (act.t === 'rm') {
        rm.theirs = true;
        if (rm.mine) return startRematch();
        ui.rematch && ui.rematch('asked');
      } else if (act.t === 'rmno') {
        rm.mine = false;
        ui.rematch && ui.rematch('declined');
      }
    }
  }
  function startRematch() {
    const opts = rematchOpts(M);
    rm = null;
    if (opts.opp === 'friend') Net.cancelWaits();
    ui.rematch && ui.rematch('start');
    newMatch(opts);
  }
  // returns 'started' or 'waiting'
  function requestRematch() {
    if (!M || !M.over) return null;
    if (!friend()) { startRematch(); return 'started'; }
    if (!Net.state) { ui.toast && ui.toast(`${oppName()} has left`); return null; }
    if (!rm || rm.M !== M) rematchListen(M);
    rm.mine = true;
    Net.send({ t: 'rm' });
    if (rm.theirs) { startRematch(); return 'started'; }
    return 'waiting';
  }
  function declineRematch() {
    if (rm && friend()) { rm.theirs = false; try { Net.send({ t: 'rmno' }); } catch (e) { } }
  }
  function archive() {
    const hist = Store.get('history', []);
    const i = hist.findIndex(h => h.id === M.id);
    const copy = clone(M); copy.cur = null;
    if (i >= 0) hist[i] = copy; else hist.unshift(copy);
    while (hist.length > 25) hist.pop();
    if (!Store.set('history', hist)) { // storage full: drop oldest analyses
      while (hist.length > 5) hist.pop();
      Store.set('history', hist);
    }
    Store.del('current');
  }
  function nextGame() { if (!M.over) startGame(); }

  async function humanResign(lvl) {
    if (!M || M.over || phase === 'over' || phase === 'opening') return false;
    const c = cur();
    if (friend()) {
      if (!(phase === 'preroll' || phase === 'moving')) return 'notnow';
      if (phase === 'moving' && partial.length) await undoAll();
      const was = phase;
      phase = 'resigning';
      board.setInteractive(false);
      Net.send({ t: 'resign', l: lvl });
      board.drawStatus(1, `${oppName()} is deciding`);
      let act;
      do { act = await Net.next(); } while (act.t !== 'racc' && act.t !== 'rdec');
      board.drawStatus(1, '');
      if (act.t === 'racc') { await endGame(1, lvl, 'resign'); return true; }
      phase = was;
      if (was === 'moving') { board.setInteractive(true); drawMoveButtons(); }
      return false;
    }
    // bot evaluates from its own perspective as if on roll
    const ctx = ctxFor(1);
    let ev;
    if (c.turn === 1 || c.turn === -1) ev = await Play.call('evaluate', c.b[0], c.b[1], ctx, aLevel());
    else { const e0 = await Play.call('evaluate', c.b[1], c.b[0], ctxFor(0), aLevel()); ev = { eq: -e0.eq }; }
    const val = await Engine.call('pointsEq', lvl, ctx);
    const accept = val >= ev.eq - 1e-4;
    if (accept) {
      if (pendingRecord && phase === 'moving') { await undoAll(); }
      board.setInteractive(false);
      await endGame(1, lvl, 'resign');
    }
    return accept;
  }

  /* ---------- resume ---------- */
  async function resume(saved) {
    M = saved;
    render(true);
    ui.update && ui.update();
    const c = cur();
    if (M.over) return;
    if (friend()) {
      try { await Net.resume(M.net, netHooks()); M.net = Net.state; }
      catch (e) { ui.toast && ui.toast('Can’t reconnect to your friend here'); return; }
      if (c.opening || c.turn === -1) return friendOpening();
      if (c.turn === 0) { if (c.dice) return humanRolled(c.dice, true); return humanPreRoll(); }
      return friendTurn();
    }
    if (c.opening || c.turn === -1) return openingRoll();
    if (c.turn === 0) { if (c.dice) return humanRolled(c.dice, true); return humanPreRoll(); }
    return botTurn();
  }

  /* ---------- stats ---------- */
  function stats(games, p) {
    let cl = 0, cn = 0, ul = 0, un = 0, luck = 0, luckN = 0, luckPts = 0, luckMwc = 0;
    const cnt = { doubtful: 0, error: 0, blunder: 0 }, ccnt = { doubtful: 0, error: 0, blunder: 0 };
    let pending = 0;
    for (const g of games) for (const r of g.recs) {
      if (r.p !== p) continue;
      if (r.k === 'move') {
        if (r.luck != null) { luck += r.luck; luckN++; luckPts += r.luck * (r.ctx.cube || 1); if (r.mwcK) luckMwc += r.luck * r.mwcK; }
        if (!r.an) { if (!r.forcedNone) pending++; continue; }
        if (r.forced || r.forcedNone || r.an.total <= 1) continue;
        cl += r.an.loss; cn++;
        const b = band(r.an.loss); if (cnt[b] != null) cnt[b]++;
      } else if (r.k === 'cube' || r.k === 'take') {
        if (!r.an) { pending++; continue; }
        if (!r.counted) continue;
        ul += r.loss; un++;
        const b = band(r.loss); if (ccnt[b] != null) ccnt[b]++;
      }
    }
    const pr = (l, n) => n ? 500 * l / n : null;
    return {
      prChecker: pr(cl, cn), prCube: pr(ul, un), prAll: pr(cl + ul, cn + un), nChecker: cn, nCube: un,
      lossChecker: cl, lossCube: ul, cnt, ccnt, luck, luckN, luckPts, luckMwc, luckPer: luckN ? luck / luckN : 0, pending
    };
  }

  return {
    attach(b, hooks) { board = b; Object.assign(ui, hooks); },
    newMatch, resume, nextGame, humanResign, stats, ensureAnalysis, band, requestRematch, declineRematch,
    get rematchAsked() { return !!(rm && rm.M === M && rm.theirs); },
    get M() { return M; }, get phase() { return phase; }, get busy() { return busy; }, previewBest,
    canPick, dests, tap, drop, undo, diceTap, swapDice,
    button(id) {
      Sound.unlock();
      if (id === 'roll') return doRoll();
      if (id === 'double') return doDouble();
      if (id === 'undo') return undo();
      if (id === 'done') return confirmMove();
      if (id === 'dice') return diceTap();
      if (id === 'take' || id === 'pass') { const r = ui._cubeResolve; ui._cubeResolve = null; if (r) r(id); }
    },
    key(e) {
      if (phase === 'moving') {
        if (e.key === 'Backspace' || (e.key === 'z' && (e.ctrlKey || e.metaKey))) { e.preventDefault(); undo(); }
        else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (turnInfo && partial.length === turnInfo.maxTotal) confirmMove(); else swapDice(); }
      } else if (phase === 'preroll') {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'r') { e.preventDefault(); doRoll(); }
        else if (e.key === 'd' && canDouble(0)) { e.preventDefault(); doDouble(); }
      }
    },
    redraw() {
      if (!M) return;
      const c = cur();
      const sel = { dice: c.dice, phase };
      board.setSpeed(SPEEDS[Settings.speed] || 1);
      board.rebuild(c.b, { flip: Settings.flip, humanLight: Settings.humanLight, pips: Settings.pips, rot: boardRot(), slots: boardSlots() });
      drawCubeNow(phase === 'preroll' && canDouble(0));
      if (phase === 'moving') drawMoveButtons();
      if (phase === 'preroll') board.drawButtons(prerollButtons(canDouble(0)));
      else if (c.dice) board.drawDice({ p: c.turn === 1 ? 1 : 0, vals: c.dice.slice(), used: [false, false], order: [0, 1] });
      board.setMarked(lastBotIds);
    },
    pips() { if (!M || !M.cur) return null; return [R.pips(M.cur.b[0]), R.pips(M.cur.b[1])]; },
    canDoubleNow: () => M && phase === 'preroll' && canDouble(0),
    get isFriend() { return friend(); },
    get oppName() { return M ? (friend() ? Net.oppName : 'Bot') : 'Bot'; },
    debugRestart() { render(true); humanRolled(cur().dice, true); },
    certainLoss
  };
})();

// The board is always drawn the standard way (you move from top right round to bottom right).
// On tall screens it sits at the top with big controls underneath.
function isPortrait() {
  const st = document.querySelector('.stage');
  if (!st) return false;
  const r = st.getBoundingClientRect();
  return r.height > r.width * 1.05;
}
function boardRot() {
  document.getElementById('app').classList.toggle('portrait', isPortrait());
  return 0;
}
// How many checkers fit on a point before stacks compress: chosen so the board fills the space
// (taller on phones held upright, shorter and wider on phones held sideways).
function boardSlots() {
  const bx = document.querySelector('.boardbox');
  if (!bx || typeof G === 'undefined') return 5;
  const r = bx.getBoundingClientRect();
  if (!r.width || !r.height) return 5;
  const portrait = document.getElementById('app').classList.contains('portrait');
  const h = r.height - (portrait ? 84 : 0);
  return G.bestSlots(r.width, Math.max(120, h));
}
const dotStyle = (p) => `background:${(p === 0) === Settings.humanLight ? '#f2efe9' : '#1a1d21'}`;

const UI = (() => {

  function toast(msg) {

  /* ---------- overlay helpers ---------- */

    const s = openCard(html, { dismiss: !!(Game.M && !Game.M.over) });

    $('#fCode').onkeydown = (e) => { if (e.key === 'Enter') $('#fJoin').click(); };

  /* ---------- friend games ---------- */
  // Plain-English reason for a friend-play failure, with the technical code for diagnosis
  function friendError(e) {
    const code = (e && (e.code || e.message)) || String(e);
    let why = 'Something went wrong connecting to the friend-play server.';
    if (/operation-not-allowed|admin-restricted/.test(code)) why = 'Anonymous sign-in isn’t switched on in Firebase (Authentication → Sign-in method → Anonymous).';
    else if (/permission.denied|PERMISSION_DENIED/i.test(code)) why = 'The database refused access. Check the Realtime Database rules were published.';
    else if (/load /.test(code)) why = 'Couldn’t load the friend-play code. Check your internet connection.';
    else if (/network/i.test(code)) why = 'No connection to the friend-play server. Check your internet connection.';
    else if (/timeout/i.test(code)) why = 'The database didn’t answer. It may not have been created yet, or its address is different.';
    else if (/unavailable/.test(code)) why = 'Friend play isn’t available in this view.';
    return why + ' (Details: ' + String(code).slice(0, 160) + ')';

  async function hostFriend(cfg, name) {

    let started = false;
    let st;
    try {
      st = await Net.host(cfg, name, {
        found: (p) => {
          if (started) return; started = true;
          closeCard();
          Game.newMatch({ mode: 'normal', matchTo: cfg.matchTo, cubeOn: cfg.cubeOn, jacoby: cfg.jacoby, level: Settings.level, opp: 'friend', net: Net.state, oppName: Net.oppName });
